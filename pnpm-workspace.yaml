  "@orpc/json-schema": 2.0.0-beta.44
  "@orpc/openapi": 2.0.0-beta.43
  "@orpc/server": 2.0.0-beta.43
  "@orpc/zod": 2.0.0-beta.43
  "@testcontainers/postgresql": ^12.2.1
  "@types/node": ^24
  "@types/pg": ^8.23.1
  "@types/ws": ^8.18.2
  auth: 1.7.11
  better-auth: 1.7.11
  canonicalize: ^5.1.0
  crossws: ^0.4.15
  effect: ^4.0.5
