packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAge: 1440
allowBuilds:
  # Both download their platform's native binary in postinstall; wrangler needs them.
  workerd: true
  esbuild: true
  # Testcontainers' Docker client pulls these in; their install scripts are optional
  # native speed-ups or version checks it does not need.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # The Runner's dependencies. pi-ai's Google SDK has a no-op install script.
  "@google/genai": false
catalog:
  "@anthropic-ai/sandbox-runtime": ^0.0.80
  "@better-auth/api-key": 1.7.11
  "@earendil-works/chord": ^1.3.0
  "@earendil-works/pi-ai": ^1.3.0
  "@earendil-works/pi-durable": ^1.3.0
  "@earendil-works/pi-env": ^1.3.0
  "@effect/platform-node-shared": ^4.0.5
  "@hono/node-server": ^2.1.5
  "@orpc/client": 2.0.0-beta.44
  "@orpc/contract": 2.0.0-beta.43
