version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Types must match the Node versions we support (engines), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # which 7 declares Node 22.22.2 or later, above the Runner's floor of 22.19.
      - dependency-name: "which"
        update-types: ["version-update:semver-major"]
    groups:
      better-auth:
        patterns:
          - "auth"
          - "better-auth"
          - "@better-auth/*"
      better-auth-security:
        applies-to: security-updates
        patterns:
          - "auth"
          - "better-auth"
          - "@better-auth/*"
      # oRPC's packages are released together, and mixed versions do not type-check.
      orpc:
        patterns:
          - "@orpc/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Base images in the Dockerfile, pinned by tag and digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
