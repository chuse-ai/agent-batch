name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ready:
    # Ubuntu 24.04 rather than ubuntu-latest: from 25.04, Ubuntu denies sandbox-runtime's seccomp
    # helper the capability it needs, so no job could run (anthropics/sandbox-runtime#429).
    runs-on: &ubuntu ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
      # What the Runner's job sandbox needs on Ubuntu (ADR 0027), so tests that run jobs run them as the
      # Runner does. GitHub's image already keeps the runner user's systemd manager running (linger),
      # which the per-job memory limit uses.
      - &job-sandbox
        name: Job sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          # Ubuntu 24.04 strips the capabilities from the user namespaces the sandbox creates (ADR 0027).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: vp run ready
      # The migrations must create everything Better Auth needs.
      - run: vp run --no-cache hub#db:draft-auth-migration --check
      # The committed database types must be what the migrations produce.
      - run: vp run --no-cache hub#db:types
      - name: Fail if the generated database types differ
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::The hub's database types are out of date. Run \`vp run hub#db:types\` and commit the result."
            exit 1
          fi

  # What users run on their own Node (the CLI, the Runner and their shared contract) supports Node 22
  # from the lowest release `engines.node` allows (ADR 0024); the hub runs only on Node 26 and workerd.
  node-22:
    runs-on: *ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          node-version: 22.19.0
      - *job-sandbox
      - run: vp run --filter runner --filter agent-batch test
      # The hub in workerd, with the tests and the Runners they start on Node 22. The `node` project
      # would run the hub itself on the tests' Node.
      - run: vp test --project workers
        working-directory: apps/hub

  hub-image:
    runs-on: *ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # What the Runner's image needs of an Ubuntu 24.04 host, as BuildKit's rootless image
      # does: AppArmor otherwise denies its jobs' sandboxes the user namespaces they need.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Builds the hub's and the Runner's Docker images, starts the hub on a fresh database (ADR 0014)
      # and the Runner beside it; the default test run skips these tagged tests (ADR 0003).
      - run: vp test --project node --tags-filter=container
        working-directory: apps/hub
